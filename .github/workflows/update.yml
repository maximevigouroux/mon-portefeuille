name: Mise à jour nocturne
on:
  schedule:
    - cron: "0 20 * * 1-5"   # 20h UTC, jours de bourse
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas
      - run: python update.py
      - run: |
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add docs/data.json && (git commit -m "maj données" && git push || echo "rien à commiter")
