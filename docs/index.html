<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon portefeuille</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#12151c;color:#e8e8e8;margin:0;padding:16px}
h1{margin:0 0 4px}.sub{color:#9aa;margin-bottom:16px}
.card{background:#1b1f2a;border-radius:10px;padding:14px;margin-bottom:16px}
#tm{position:relative;height:420px}
#tm div{position:absolute;box-sizing:border-box;border:2px solid #12151c;padding:6px;font-size:13px;overflow:hidden;color:#fff}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.g{grid-template-columns:1fr}}
.pos{color:#4ade80}.neg{color:#f87171}
</style></head><body>
<h1>Mon portefeuille</h1><div class="sub" id="sub"></div>
<div class="card"><b>Répartition (taille = valeur, couleur = performance depuis l'achat)</b><div id="tm"></div></div>
<div class="card"><b>Performance depuis l'achat (%)</b><canvas id="perf" height="110"></canvas></div>
<div class="g"><div class="card"><b>Zones géographiques</b><canvas id="geo"></canvas></div>
<div class="card"><b>Secteurs</b><canvas id="sec"></canvas></div></div>
<script>
const pal=["#4e79a7","#f28e2b","#e15759","#76b7b2","#59a14f","#edc948","#b07aa1","#ff9da7","#9c755f"];
function layout(it,x,y,w,h,out){
 if(it.length==1){out.push({...it[0],x,y,w,h});return}
 const tot=it.reduce((a,b)=>a+b.value,0);let acc=0,i=0;
 while(i<it.length-1&&acc+it[i].value<=tot/2){acc+=it[i].value;i++}
 if(i==0){acc=it[0].value;i=1}
 const a=it.slice(0,i),b=it.slice(i),f=acc/tot;
 if(w>=h){layout(a,x,y,w*f,h,out);layout(b,x+w*f,y,w*(1-f),h,out)}
 else{layout(a,x,y,w,h*f,out);layout(b,x,y+h*f,w,h*(1-f),out)}}
function color(o){
 if(o.perf_pct<0){const a=Math.min(Math.abs(o.perf_pct)/10,1);return `rgb(${150+90*a|0},50,60)`}
 if(o.day_pct<0){const a=Math.min(Math.abs(o.day_pct)/3,1);return `rgb(${210+30*a|0},${130-30*a|0},30)`}
 const a=Math.min(o.perf_pct/10,1);return `rgb(34,${120+80*a|0},80)`}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
 const gain=d.total_value-d.total_invested;
 document.getElementById("sub").innerHTML=`Valeur : <b>${d.total_value.toFixed(0)} €</b> · Investi : ${d.total_invested.toFixed(0)} € · <span class="${gain>=0?'pos':'neg'}">${gain>=0?'+':''}${gain.toFixed(0)} €</span> · maj ${d.updated}`;
 const items=[...d.holdings].sort((a,b)=>b.value-a.value),out=[];layout(items,0,0,100,100,out);
 document.getElementById("tm").innerHTML=out.map(o=>`<div style="left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%;background:${color(o)}"><b>${o.name}</b><br>${o.value.toFixed(0)} € (${o.envelope})<br>${o.perf_pct>=0?'+':''}${o.perf_pct}% · jour ${o.day_pct>=0?'+':''}${o.day_pct}%</div>`).join("");
const H=d.history,base=[{label:"Total",data:H.total_perf,color:"#ffffff",w:3}];
Object.entries(H.per_holding).forEach(([k,v],i)=>base.push({label:k,data:v,color:pal[i%9],w:1.5}));
const ds=base.map(b=>({label:b.label,data:b.data,borderColor:b.color,backgroundColor:b.color,borderWidth:b.w,pointRadius:3,pointHoverRadius:6,pointBackgroundColor:b.color,pointBorderColor:b.color,tension:0}));
let hov=-1;
const glow={id:"glow",
 beforeDatasetDraw(c,a){if(a.index===hov){c.ctx.save();c.ctx.shadowColor=c.data.datasets[a.index].borderColor;c.ctx.shadowBlur=18;}},
 afterDatasetDraw(c,a){if(a.index===hov)c.ctx.restore();}};
new Chart(perf,{type:"line",data:{labels:H.dates,datasets:ds},plugins:[glow],options:{
 interaction:{mode:"nearest",intersect:false},
 onHover:(e,els,c)=>{const i=els.length?els[0].datasetIndex:-1;if(i===hov)return;
  hov=i;c.data.datasets.forEach((s,j)=>{s.borderWidth=j===i?base[j].w+3:base[j].w;s.pointRadius=j===i?5:3;});c.update("none");},
 plugins:{legend:{labels:{color:"#ccc"}}},scales:{x:{ticks:{color:"#999"}},y:{ticks:{color:"#999"}}}}});
 const pie=(id,o)=>new Chart(id,{type:"doughnut",data:{labels:Object.keys(o),datasets:[{data:Object.values(o),backgroundColor:pal}]},options:{plugins:{legend:{position:"right",labels:{color:"#ccc"}}}}});
 pie(geo,d.geo);pie(sec,d.sector);
});
</script></body></html>
